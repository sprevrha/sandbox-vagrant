## Docker Compose file for WordPress with MariaDB and Nginx
# This file sets up a WordPress site with a MariaDB database and Nginx as FastCGI PHP frontend.
# It includes the necessary environment variables and volume mounts for persistent storage. 

volumes:
  # Have Docker manage the database and redis data volumes.
  redis_data:
  db_data:
  # wordpress volume is used to persist WordPress files, themes, plugins, and uploads. 
  # So we use a bind mount to a local directory and define it in the service.
  # wordpress_data: 

networks:
  ${DOCKER_NETWORK:-docker_network}:
    # For simple setups, bridge is fine. 
    # For more complex deployments or better performance/isolation, consider user-defined bridges or other network drivers.
    driver: ${DOCKER_NETWORK_DRIVER:-bridge}
    
secrets:
  db_root_password:
    file: ${GUEST_CONF_DIR}/secrets/db_root_password.txt
  db_user:
    file: ${GUEST_CONF_DIR}/secrets/db_user.txt
  db_password:
    file: ${GUEST_CONF_DIR}/secrets/db_password.txt
  redis_password:
    file: ${GUEST_CONF_DIR}/secrets/redis_password.txt
services:
  db:
    image: ${DB_IMAGE:-mariadb:10.11}
    container_name: ${DB_CONTAINER_NAME:-db}
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER_FILE: /run/secrets/db_user
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - db_data:/var/lib/mysql
      - ${GUEST_LOG_DIR:-./logs}/db:/var/log/mysql
    networks:
      - ${DOCKER_NETWORK:-docker_network}
    secrets:
      - db_root_password
      - db_user
      - db_password
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER --password=\"$$(cat /run/secrets/db_password)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s # Increased start_period to 30s to allow MariaDB to initialize properly
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.5'  # MariaDB can be CPU intensive
          memory: 1024M # MariaDB can use significant memory for caching
        reservations:
          cpus: '0.5'
          memory: 512M
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes --requirepass $$(cat /run/secrets/redis_password)
    volumes:
      - redis_data:/data
    networks:
      - wordpress_network
    restart: unless-stopped
    healthcheck:
      # Using REDISCLI_AUTH environment variable for password which is generally more robust
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s # Increased start_period, 10s might be too short for Redis to fully initialize with password
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    secrets:
      - redis_password
    deploy:
      resources:
        limits:
          cpus: '0.5' # Redis is often memory-bound, but CPU is still relevant
          memory: 256M # Depending on cache size
        reservations:
          cpus: '0.2'
          memory: 128M
  # WordPress service using PHP-FPM
  # This service runs the WordPress application with PHP-FPM.
  wordpress:
    depends_on:
      db:
        condition: service_healthy # Wait for DB to be healthy
      redis:
        condition: service_healthy # Wait for Redis to be healthy
    image: ${WORDPRESS_IMAGE:-wordpress:6.4-php8.2-fpm-alpine}
    container_name: ${WORDPRESS_CONTAINER_NAME:-wordpress}
  # Example addition to wordpress service
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/wp-admin/install.php"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s # Increased start_period to 30s to allow WordPress to initialize properly  
    environment:
      WORDPRESS_DB_HOST: ${DB_CONTAINER_NAME:-db}:3306
      WORDPRESS_DB_USER_FILE: /run/secrets/db_user
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'https://${APP_DOMAIN}');
        define('WP_SITEURL', 'https://${APP_DOMAIN}');
        define('FORCE_SSL_ADMIN', true);
        // Reverse Proxy SSL Detection
        if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && $_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
          $_SERVER['HTTPS'] = 'on';
        }
        // Alternative: For Load Balancer 
        if (isset($_SERVER['HTTP_X_FORWARDED_SSL']) && $_SERVER['HTTP_X_FORWARDED_SSL'] === 'on') {
          $_SERVER['HTTPS'] = 'on';
        }       
        // Redis Object Cache Configuration
        # define('WP_REDIS_DISABLED', true);
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_REDIS_PASSWORD', file_get_contents('/run/secrets/redis_password'));
        define('WP_REDIS_CLIENT', 'phpredis');            // Use phpredis client
        define('WP_REDIS_DATABASE', 0);
        define('WP_REDIS_TIMEOUT', 1);
        define('WP_REDIS_READ_TIMEOUT', 1);
        define('WP_REDIS_MAXTTL', 86400);
        define('WP_REDIS_SCHEME', 'tcp');

        define('DISABLE_WP_CRON', true);                  // Disable WP-Cron to use a real cron job instead
        define('XMLRPC_REQUEST', false);                  // Disable XML-RPC for security
        define('REST_API_DISABLED', false);               // completely disabling the REST API will break many WordPress functionalities
        define('HEARTBEAT_DISABLED', false);              // Heartbeat API is crucial for real-time communication in the WordPress admin area
        define('AUTOMATIC_UPDATER_DISABLED', true);       // Disable automatic updates
        add_filter('show_admin_bar', '__return_false');   // Disable the admin bar for all users. While it cleans up the frontend, it removes convenient shortcuts for logged-in users. Consider if this is truly desired for all user roles.
        remove_action('wp_head', 'wp_generator');         // Disable the WordPress version in the HTML source
        remove_action('wp_head', 'print_emoji_detection_script', 7);  // Disable the emoji script
        remove_action('wp_print_styles', 'print_emoji_styles');      // Disable the REST API link in the HTML source
        remove_action('wp_head', 'rest_output_link_wp_head', 10);    // Disable the REST API link in the HTML source 
        remove_action('wp_head', 'wp_oembed_add_discovery_links');   // Disable the oEmbed discovery links
        remove_action('wp_head', 'wp_oembed_add_host_js');           // Disable the oEmbed JavaScript
        add_filter('the_generator', '__return_empty_string');        // Disable the WordPress version in the RSS feed
        // Disable the WordPress version in the HTML source
        add_filter('style_loader_src', 'remove_wp_version_from_css_js', 9999);
        add_filter('script_loader_src', 'remove_wp_version_from_css_js', 9999);
        function remove_wp_version_from_css_js($src) {
            if (strpos($src, 'ver=') !== false) {
                $src = remove_query_arg('ver', $src);
            }
            return $src;
        }
        // Cache-Konfiguration
        define('WP_CACHE', true);
        define('WP_CACHE_KEY_SALT', 'spendoo_'); 
        // Additional security settings
        define('FORCE_SSL_LOGIN', true);
        define('DISALLOW_FILE_EDIT', true);
        define('WP_ALLOW_REPAIR', false);
        define('WP_POST_REVISIONS', 5);
        define('AUTOSAVE_INTERVAL', 300); # 5 minutes
        define('WP_MEMORY_LIMIT', '${WP_MEMORY_LIMIT}');
        define('WP_MAX_MEMORY_LIMIT', '${WP_MAX_MEMORY_LIMIT}');
        // Debugging settings
        # Uncomment the following lines to disable debugging
        # define('WP_DEBUG', false); #
        # define('WP_DEBUG_LOG', false); #
        # define('WP_DEBUG_DISPLAY', false); #
        # @ini_set('display_errors', 0); #
    volumes:
      - ${GUEST_DATA_DIR:-.}/wordpress_data:${APP_PATH}
      - ${GUEST_LOG_DIR:-./logs}/wordpress/debug.log:${APP_PATH}/wp-content/debug.log
    networks:
      - ${DOCKER_NETWORK:-docker_network}
    restart: unless-stopped
    secrets:
      - db_user
      - db_password
      - redis_password
    # For production, we add resources.limits (e.g., cpus, memory) 
    # to prevent any single container from consuming all host resources.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
  nginx:
    depends_on:
      wordpress:
        condition: service_healthy
    image: ${NGINX_IMAGE:-nginx:1.25.5-alpine}
    container_name: ${NGINX_CONTAINER_NAME:-nginx}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      NGINX_SERVER_NAME: ${APP_DOMAIN}
      NGINX_SERVER_ALIAS: www.${APP_DOMAIN} # Concatenated using APP_DOMAIN
      NGINX_PORT: ${NGINX_HTTP_PORT:-80}
      NGINX_SSL_PORT: ${NGINX_HTTPS_PORT:-443}
      NGINX_ROOT_DIR: ${APP_PATH}
      NGINX_INDEX: index.php index.html index.htm
      NGINX_LOG_FORMAT: 'main "$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"'
      NGINX_ACCESS_LOG: ${LOG_PATH:-/var/log}/nginx/access.log
      NGINX_ERROR_LOG:  ${LOG_PATH:-/var/log}/nginx/error.log
      NGINX_CLIENT_BODY_BUFFER_SIZE: ${NGINX_CLIENT_BODY_BUFFER_SIZE}
      NGINX_CLIENT_HEADER_BUFFER_SIZE: ${NGINX_CLIENT_HEADER_BUFFER_SIZE}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE}
      NGINX_CLIENT_BODY_TIMEOUT: ${NGINX_CLIENT_BODY_TIMEOUT}
      NGINX_CLIENT_HEADER_TIMEOUT: ${NGINX_CLIENT_HEADER_TIMEOUT}
      NGINX_SENDFILE: "on"
      NGINX_TCP_NODELAY: "on"
      NGINX_TCP_NOPUSH: "on"
      NGINX_WORKER_PROCESSES: auto
      NGINX_LARGE_CLIENT_HEADER_BUFFERS: 4 8k
      NGINX_KEEPALIVE_TIMEOUT: ${NGINX_KEEPALIVE_TIMEOUT}
      NGINX_SEND_TIMEOUT: ${NGINX_SEND_TIMEOUT}
      NGINX_RESET_TIMEDOUT_CONNECTION: "on"
      NGINX_UNDERSCORES_IN_HEADERS: "on"
      NGINX_CHARSET: "utf-8"
      NGINX_CHARSET_TYPES: 'text/html text/plain text/css application/json application/javascript application/x-javascript application/xml application/xml+rss text/javascript image/svg+xml image/x-icon image/png image/jpeg image/gif'
      
      # Gzip settings
      NGINX_GZIP_HTTP_VERSION: '1.1'
      NGINX_GZIP: "on"
      NGINX_GZIP_COMP_LEVEL: ${NGINX_GZIP_COMP_LEVEL}
      NGINX_GZIP_MIN_LENGTH: ${NGINX_GZIP_MIN_LENGTH}
      NGINX_GZIP_PROXIED: any
      NGINX_GZIP_TYPES: 'text/plain text/css application/json application/javascript application/x-javascript application/xml application/xml+rss text/javascript application/font-woff2 application/font-woff image/svg+xml image/x-icon image/png image/jpeg image/gif'
      NGINX_GZIP_VARY: "on"
      NGINX_GZIP_DISABLE: 'msie6'
      NGINX_SERVER_TOKENS: "off"

      NGINX_TYPES_HASH_MAX_SIZE: ${NGINX_TYPES_HASH_MAX_SIZE}
      NGINX_TYPES_HASH_BUCKET_SIZE: ${NGINX_TYPES_HASH_BUCKET_SIZE}
      NGINX_TYPES_HASH_MIN_USES: ${NGINX_TYPES_HASH_MIN_USES}
      NGINX_TYPES_HASH_BUCKETS: ${NGINX_TYPES_HASH_BUCKETS}

      NGINX_PREFER_SERVER_CIPHERS: "on"
      NGINX_HTTP2: "true"
      NGINX_REWRITE: "true"
      NGINX_HSTS: "true"
      NGINX_X_FRAME_OPTIONS: "SAMEORIGIN"
      NGINX_X_CONTENT_TYPE_OPTIONS: "nosniff"
      NGINX_X_XSS_PROTECTION: "1; mode=block"
      NGINX_REFERRER_POLICY: "no-referrer-when-downgrade"

      # CSP is quite restrictive, which is good for security, but might cause issues with some plugins or external scripts.
      NGINX_CONTENT_SECURITY_POLICY: "default-src 'self'; \
        img-src 'self' data:; \
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://ajax.googleapis.com https://www.google-analytics.com; \
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
        font-src 'self' https://fonts.gstatic.com; \
        connect-src 'self'; \
        frame-src 'self' https://www.youtube.com; \
        object-src 'none'; \
        base-uri 'self';"
      NGINX_STRICT_TRANSPORT_SECURITY: "max-age=31536000; includeSubDomains; preload"
      NGINX_REWRITE_LOG: "off"

      # SSL settings
      NGINX_SSL: "on"
      NGINX_ENABLE_SSL: "true"
      NGINX_SSL_CERT: ${NGINX_SSL_CERT_PATH}
      NGINX_SSL_CERT_KEY: ${NGINX_SSL_KEY_PATH}
      NGINX_SSL_TRUSTED_CERT: ${NGINX_SSL_TRUSTED_CERT_PATH}
      NGINX_SSL_DHPARAM: ${NGINX_SSL_DHPARAM_PATH}
      NGINX_SSL_CIPHERS: 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305'
      NGINX_SSL_PROTOCOLS: 'TLSv1.2 TLSv1.3'
      NGINX_SSL_SESSION_TICKET: "on"
      NGINX_SSL_SESSION_CACHE: ${NGINX_SSL_SESSION_CACHE}
      NGINX_SSL_SESSION_TIMEOUT: ${NGINX_SSL_SESSION_TIMEOUT}
      NGINX_SSL_STAPLING: "on"
      NGINX_SSL_STAPLING_VERIFY: "on"
      NGINX_SSL_STAPLING_RESPONSE_TIMEOUT: ${NGINX_SSL_STAPLING_RESPONSE_TIMEOUT}
      NGINX_SSL_VERIFY_DEPTH: ${NGINX_SSL_VERIFY_DEPTH}
      NGINX_SSL_VERIFY_CLIENT: "off"
      
      NGINX_RESOLVER: ${NGINX_RESOLVER}
      NGINX_RESOLVER_TIMEOUT: ${NGINX_RESOLVER_TIMEOUT}
      NGINX_RESOLVER_VALIDITY: ${NGINX_RESOLVER_VALIDITY}
      # Proxy settings
      NGINX_PROXY_PASS: ${WORDPRESS_CONTAINER_NAME:-wordpress}:9000
      NGINX_PROXY_READ_TIMEOUT: ${NGINX_PROXY_READ_TIMEOUT}
      NGINX_PROXY_CONNECT_TIMEOUT: ${NGINX_PROXY_CONNECT_TIMEOUT}
      NGINX_PROXY_SEND_TIMEOUT: ${NGINX_PROXY_SEND_TIMEOUT} 
      NGINX_PROXY_BUFFER_SIZE: ${NGINX_PROXY_BUFFER_SIZE}
      NGINX_PROXY_BUFFERS: ${NGINX_PROXY_BUFFERS}
      NGINX_PROXY_BUSY_BUFFERS_SIZE: ${NGINX_PROXY_BUSY_BUFFERS_SIZE}
      # Proxy temporary file settings
      NGINX_PROXY_MAX_TEMP_FILE_SIZE: ${NGINX_PROXY_MAX_TEMP_FILE_SIZE}
      NGINX_PROXY_TEMP_FILE_SIZE: ${NGINX_PROXY_TEMP_FILE_SIZE}
      NGINX_PROXY_TEMP_FILE_WRITE_SIZE: ${NGINX_PROXY_TEMP_FILE_WRITE_SIZE}
      NGINX_PROXY_TEMP_PATH: /var/cache/nginx/proxy_temp
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "${APP_DOMAIN}:127.0.0.1" 
    volumes:
      - ${GUEST_DATA_DIR:-.}/wordpress_data:${APP_PATH}
      - ${GUEST_CONF_DIR:-.}/nginx-conf:/etc/nginx/conf.d
      - ${GUEST_CONF_DIR:-.}/ssl-certs:/etc/ssl/certs
      - ${GUEST_LOG_DIR:-.}/nginx-logs:/var/log/nginx
    networks:
      - ${DOCKER_NETWORK:-docker_network}
    entrypoint: /etc/nginx/conf.d/entrypoint.sh
    deploy:
      resources:
        limits:
          cpus: '0.5' # Nginx is usually efficient but needs CPU for SSL/Gzip
          memory: 128M # Fairly low memory footprint
        reservations:
          cpus: '0.1'
          memory: 64M